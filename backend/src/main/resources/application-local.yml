spring:
  datasource:
    url:      jdbc:postgresql://localhost:5432/acougue_db
    username: acougue
    password: acougue@2025
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    out-of-order: false
kafka:
  enabled: false
seguranca:
  jwt:
    # Só para desenvolvimento local — produção usa a variável JWT_SECRET
    segredo: dev-local-jwt-segredo-somente-para-maquina-do-desenvolvedor
pagamento:
  # Só para desenvolvimento local — em produção use a variável PAGAMENTO_CRIPTO_CHAVE
  cripto-chave: dev-local-chave-nao-usar-em-producao
  pix:
    mp-access-token: ""
acougue:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
logging:
  level:
    com.acougue:                                   DEBUG
    org.springframework.security:                  INFO
    org.hibernate.SQL:                             DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb:                                  INFO
