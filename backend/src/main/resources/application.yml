spring:
  application:
    name: acougue-erp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/acougue_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # default_schema NÃO é setado de propósito: com multi-tenancy por
        # schema (ver com.acougue.tenant), fixar um schema aqui faria o
        # Hibernate literal-qualificar "public.tabela" em toda SQL gerada,
        # ignorando o search_path trocado por tenant e quebrando o isolamento.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: acougue-erp
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.acougue.modules.messaging.events"
        spring.json.use.type.headers: false
server:
  port: 8080
  servlet:
    context-path: /api
logging:
  level:
    # INFO em produção: DEBUG registra detalhes de requisições que não devem ficar em log
    com.acougue: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
seguranca:
  jwt:
    # OBRIGATÓRIA: segredo que assina os tokens de login. Sem ela a aplicação
    # não sobe. Gere com: openssl rand -base64 48  (nunca coloque no código)
    segredo: ${JWT_SECRET:}
  cors:
    # Origens do navegador que podem chamar a API direto. Produção passa pelo
    # rewrite do Vercel (mesma origem); o desenvolvimento chama direto.
    origens: ${CORS_ORIGENS:https://sysflexerp.vercel.app,https://sysflexerpdev.vercel.app,https://sis-meet-house-*-jgp-tech.vercel.app,http://localhost:*}
  login:
    # Tentativas erradas seguidas para o mesmo login antes de bloquear por alguns minutos
    max-tentativas: 8
    bloqueio-minutos: 15
acougue:
  cors:
    allowed-origins: ${ACOUGUE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  nfce:
    ambiente: 2
    uf: 35
kafka:
  enabled: ${KAFKA_ENABLED:false}
  sasl:
    username: ${KAFKA_SASL_USERNAME:}
    password: ${KAFKA_SASL_PASSWORD:}
  security:
    protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
demo:
  kafka:
    # Rotas /demo/kafka (publicam eventos falsos). Nunca ligar em produção.
    enabled: ${DEMO_KAFKA:false}
pagamento:
  # Chave que cifra as credenciais das adquirentes salvas no banco (tela
  # Maquininhas). Qualquer texto longo e aleatório; NÃO troque depois de
  # cadastrar credenciais (elas ficariam ilegíveis). Gere com:
  #   openssl rand -base64 32
  cripto-chave: ${PAGAMENTO_CRIPTO_CHAVE:}
  pix:
    # Fallback do PIX quando a empresa não cadastrou o Access Token do
    # Mercado Pago na tela Maquininhas (comportamento anterior).
    mp-access-token: ${MP_ACCESS_TOKEN:}

balanca:
  scheduler:
    cron:  ${BALANCA_CRON:0 0 7 * * *}
    tipo:  ${BALANCA_TIPO:TOLEDO_MGV7}
    ip:    ${BALANCA_IP:}
    porta: ${BALANCA_PORTA:8000}

# Dados do tenant public (Açougue do Zé) — já existia antes da
# multi-tenancy, então precisa de um bootstrap (ver TenantBootstrap).
# Configurável aqui só por precaução; não deve mudar na prática.
tenant:
  publico:
    codigo: ${TENANT_PUBLICO_CODIGO:001}
    slug:   ${TENANT_PUBLICO_SLUG:acougue-do-ze}
    nome:   ${TENANT_PUBLICO_NOME:Açougue e Mercearia do Zé}