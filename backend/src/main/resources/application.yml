spring:
  application:
    name: acougue-erp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/acougue_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    # Sem valor padrão: sem a variável o banco recusa a conexão, em vez de tentar a senha "postgres"
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # default_schema NÃO é setado de propósito: com multi-tenancy por
        # schema (ver com.acougue.tenant), fixar um schema aqui faria o
        # Hibernate literal-qualificar "public.tabela" em toda SQL gerada,
        # ignorando o search_path trocado por tenant e quebrando o isolamento.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: acougue-erp
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.acougue.modules.messaging.events"
        spring.json.use.type.headers: false
server:
  port: 8080
  servlet:
    context-path: /api
logging:
  level:
    # INFO em produção: DEBUG registra detalhes de requisições que não devem ficar em log
    com.acougue: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN
# Assistente de perguntas (Gemini). Sem GEMINI_API_KEY, fica desligado e some da tela.
assistente:
  gemini:
    chave: ${GEMINI_API_KEY:}
    # 3.8 Flash recusava por "alta demanda" na camada gratuita (nov/2026)
    modelo: ${GEMINI_MODELO:gemini-3.6-flash}
    url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta}
  limite:
    # A cota gratuita é uma só para todas as empresas
    por-usuario-hora: ${ASSISTENTE_LIMITE_USUARIO_HORA:20}
    por-empresa-dia: ${ASSISTENTE_LIMITE_EMPRESA_DIA:100}
    # Somando todas as empresas. Cada pergunta faz 2 ou mais chamadas, e a camada gratuita
    # recusava (403/429) já com poucas por minuto nos testes de nov/2026
    por-minuto: ${ASSISTENTE_LIMITE_MINUTO:2}

# Acesso da plataforma (código 000). Sem as três variáveis, fica desligado.
jarvis:
  login: ${JARVIS_LOGIN:}
  senha: ${JARVIS_SENHA:}
  # Segredo Base32 do app autenticador (mínimo de 16 bytes)
  totp-segredo: ${JARVIS_TOTP_SEGREDO:}

seguranca:
  jwt:
    # OBRIGATÓRIA: segredo que assina os tokens de login. Sem ela a aplicação
    # não sobe. Gere com: openssl rand -base64 48  (nunca coloque no código)
    segredo: ${JWT_SECRET:}
  cors:
    # Origens do navegador que podem chamar a API direto. Produção passa pelo
    # rewrite do Vercel (mesma origem). Só os domínios reais: localhost fica no
    # application-local.yml, e previews do Vercel entram via CORS_ORIGENS se precisar.
    origens: ${CORS_ORIGENS:https://sysflexerp.vercel.app,https://sysflexerpdev.vercel.app}
  limite:
    # Requisições por minuto: por usuário logado, e por rota de webhook (sem login). Acima disso, 429.
    por-usuario-minuto: ${LIMITE_POR_USUARIO_MINUTO:600}
    webhook-minuto: ${LIMITE_WEBHOOK_MINUTO:300}
  login:
    # Tentativas erradas seguidas para o mesmo login antes de bloquear por alguns minutos
    max-tentativas: 8
    bloqueio-minutos: 15
acougue:
  cors:
    allowed-origins: ${ACOUGUE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
kafka:
  enabled: ${KAFKA_ENABLED:false}
  sasl:
    username: ${KAFKA_SASL_USERNAME:}
    password: ${KAFKA_SASL_PASSWORD:}
  security:
    protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
demo:
  kafka:
    # Rotas /demo/kafka (publicam eventos falsos). Nunca ligar em produção.
    enabled: ${DEMO_KAFKA:false}
recebimento:
  # Dias para cancelar uma entrada de mercadoria (7 = prazo adotado no Paraná)
  prazo-cancelamento-dias: ${RECEBIMENTO_PRAZO_CANCELAMENTO_DIAS:7}
pagamento:
  # Chave que cifra as credenciais das adquirentes salvas no banco (tela
  # Maquininhas). Qualquer texto longo e aleatório; NÃO troque depois de
  # cadastrar credenciais (elas ficariam ilegíveis). Gere com:
  #   openssl rand -base64 32
  cripto-chave: ${PAGAMENTO_CRIPTO_CHAVE:}
  pix:
    # Fallback do PIX quando a empresa não cadastrou o Access Token do
    # Mercado Pago na tela Maquininhas (comportamento anterior).
    mp-access-token: ${MP_ACCESS_TOKEN:}
  webhook:
    # Endereço público para as adquirentes avisarem pagamentos (ex.: Veloce).
    # Vazio = usa o endereço pelo qual o PDV chamou a API (o rewrite /api do Vercel).
    base-url: ${PAGAMENTO_WEBHOOK_BASE_URL:}

balanca:
  scheduler:
    cron:  ${BALANCA_CRON:0 0 7 * * *}
    tipo:  ${BALANCA_TIPO:TOLEDO_MGV7}
    ip:    ${BALANCA_IP:}
    porta: ${BALANCA_PORTA:8000}

# Dados do tenant public (Açougue do Zé) — já existia antes da
# multi-tenancy, então precisa de um bootstrap (ver TenantBootstrap).
# Configurável aqui só por precaução; não deve mudar na prática.
tenant:
  publico:
    codigo: ${TENANT_PUBLICO_CODIGO:001}
    slug:   ${TENANT_PUBLICO_SLUG:acougue-do-ze}
    nome:   ${TENANT_PUBLICO_NOME:Açougue e Mercearia do Zé}