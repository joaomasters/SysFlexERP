spring:
  application:
    name: acougue-erp
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/acougue_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # default_schema NÃO é setado de propósito: com multi-tenancy por
        # schema (ver com.acougue.tenant), fixar um schema aqui faria o
        # Hibernate literal-qualificar "public.tabela" em toda SQL gerada,
        # ignorando o search_path trocado por tenant e quebrando o isolamento.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: acougue-erp
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.acougue.modules.messaging.events"
        spring.json.use.type.headers: false
server:
  port: 8080
  servlet:
    context-path: /api
logging:
  level:
    com.acougue: DEBUG
    org.hibernate.SQL: WARN
acougue:
  cors:
    allowed-origins: ${ACOUGUE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  nfce:
    ambiente: 2
    uf: 35
kafka:
  enabled: ${KAFKA_ENABLED:false}
  sasl:
    username: ${KAFKA_SASL_USERNAME:}
    password: ${KAFKA_SASL_PASSWORD:}
  security:
    protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
pagamento:
  pix:
    mp-access-token: ${MP_ACCESS_TOKEN:}
  stone:
    agent-url: ${STONE_AGENT_URL:http://localhost:12345}

balanca:
  scheduler:
    cron:  ${BALANCA_CRON:0 0 7 * * *}
    tipo:  ${BALANCA_TIPO:TOLEDO_MGV7}
    ip:    ${BALANCA_IP:}
    porta: ${BALANCA_PORTA:8000}